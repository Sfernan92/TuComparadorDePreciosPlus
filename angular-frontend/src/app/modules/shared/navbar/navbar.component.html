<!-- z-50 mantiene la barra por encima de tarjetas y elementos con efectos hover al hacer scroll. -->
<header class="bg-[#EDF6F9] shadow sticky top-0 z-50">
<div class="max-w-6xl mx-auto px-4 py-6 flex flex-wrap justify-between items-center gap-4">
    <!-- Logo -->
    <div class="flex items-center gap-4">
      <img src="misseurosinfondo.png" alt="Logotipo DonTacaño" class="w-12 h-12 scale-150 object-contain" />
      <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold text-[#006D77]">DonTacaño.com</h1>
    </div>

    <!-- Área derecha: navegación y acceso de administrador -->
    <div class="flex flex-col sm:flex-row items-center gap-4 w-full sm:w-auto">
      <a
        routerLink="/"
        routerLinkActive="enlace-nav-activo"
        [routerLinkActiveOptions]="{ exact: true }"
        class="enlace-nav font-semibold text-[var(--color-principal-oscuro)] transition hover:text-[var(--color-principal)]">
        Inicio
      </a>

      <a
        routerLink="/comparar"
        routerLinkActive="enlace-nav-activo"
        class="enlace-nav font-semibold text-[var(--color-principal-oscuro)] transition hover:text-[var(--color-principal)]">
        Comparar
      </a>
      
      <!-- async se suscribe al estado del servicio y actualiza el botón automáticamente. -->
      <ng-container *ngIf="sesionIniciada$ | async; else accesoAdmin">
        <a routerLink="/admin" class="rounded-full bg-[var(--color-acento)] px-7 py-4 font-bold text-white shadow-lg transition hover:-translate-y-0.5 hover:bg-[#e95f50] hover:shadow-xl">
          Panel administrador
        </a>
      </ng-container>

      <!-- Se muestra únicamente cuando no existe una sesión guardada. -->
      <ng-template #accesoAdmin>
        <a routerLink="/login" class="rounded-full bg-[var(--color-acento)] px-7 py-4 font-bold text-white shadow-lg transition hover:-translate-y-0.5 hover:bg-[#e95f50] hover:shadow-xl">
          Acceso admin
        </a>
      </ng-template>

    </div>
  </div>
</header>
