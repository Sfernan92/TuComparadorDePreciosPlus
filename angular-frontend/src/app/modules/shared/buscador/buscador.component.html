<div class="relative w-full">
  <!-- Icono visual de búsqueda -->
  <span
    class="pointer-events-none absolute left-5 top-1/2 -translate-y-1/2 text-xl text-[var(--color-principal)]"
    aria-hidden="true">
    ⌕
  </span>

  <!-- Campo donde el usuario escribe -->
  <input
    type="text"
    placeholder="Buscar productos (Tomates, Leche, Plátanos...)"
    [(ngModel)]="terminoBusqueda"
    class="w-full rounded-full border border-[var(--color-borde)] bg-white py-4 pl-14 pr-6 text-[var(--color-texto)] shadow-lg outline-none transition focus:border-[var(--color-principal)] focus:ring-4 focus:ring-[#007d82]/10" />

  <!-- Sugerencias que ya generaba el componente -->
  <div
    *ngIf="terminoBusqueda.trim() !== ''"
    class="absolute left-0 top-full z-50 mt-3 w-full rounded-2xl bg-white p-3 text-left shadow-xl">

    <ul *ngIf="obtenerAlimentosFiltrados().length > 0; else sinResultados">
      <li
        *ngFor="let alimento of obtenerAlimentosFiltrados()"
        (click)="seleccionarAlimento(alimento.id)"
        class="cursor-pointer rounded-xl px-4 py-3 text-base text-[var(--color-texto)] transition hover:bg-[#eef9f5]">
        {{ alimento.nombre }}
      </li>
    </ul>

    <ng-template #sinResultados>
      <p class="px-4 py-3 text-sm text-[var(--color-texto-suave)]">
        No se encontraron alimentos.
      </p>
    </ng-template>
  </div>
</div>
