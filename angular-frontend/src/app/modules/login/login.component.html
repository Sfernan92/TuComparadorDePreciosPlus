<div class="flex min-h-screen flex-col bg-[#f8fbf8]">
  <app-navbar></app-navbar>

  <!-- Fondo decorativo y tarjeta de acceso -->
  <main class="relative flex flex-1 items-center justify-center overflow-hidden px-4 py-14 sm:py-20">
    <div class="pointer-events-none absolute -left-32 top-10 h-96 w-96 rounded-full bg-[#e2f5ed] blur-3xl"></div>
    <div class="pointer-events-none absolute -right-32 bottom-0 h-96 w-96 rounded-full bg-[#ffe7d4] blur-3xl"></div>

    <section class="relative w-full max-w-xl rounded-[2rem] border border-white/80 bg-white/95 p-8 shadow-[var(--sombra-tarjeta)] sm:p-10">
      <div class="text-center">
        <p class="text-sm font-bold uppercase tracking-[0.16em] text-[var(--color-principal)]">Área de administración</p>
        <h1 class="mt-3 text-4xl font-extrabold tracking-tight text-[var(--color-principal-oscuro)]">Bienvenido de nuevo</h1>
        <p class="mt-3 text-lg text-[var(--color-texto-suave)]">Inicia sesión para gestionar DonTacaño.</p>
      </div>

      <form (ngSubmit)="login()" class="mt-9" style="display: grid; gap: 2rem;">
        <div>
          <label for="email" class="mb-2 block font-bold text-[var(--color-principal-oscuro)]">Correo electrónico</label>
          <input id="email" [(ngModel)]="email" name="email" type="email" required placeholder="Ej. tu@correo.com"
            class="w-full rounded-xl border border-[var(--color-borde)] bg-white px-5 py-4 text-[var(--color-texto)] outline-none transition placeholder:text-[var(--color-texto-suave)] focus:border-[var(--color-principal)] focus:ring-4 focus:ring-[#007d82]/10" />
        </div>

        <div class="relative">
          <label for="password" class="mb-2 block font-bold text-[var(--color-principal-oscuro)]">Contraseña</label>
          <input id="password" [(ngModel)]="password" name="password" [type]="showPassword ? 'text' : 'password'" required placeholder="Introduce tu contraseña"
            class="w-full rounded-xl border border-[var(--color-borde)] bg-white px-5 py-4 pr-14 text-[var(--color-texto)] outline-none transition placeholder:text-[var(--color-texto-suave)] focus:border-[var(--color-principal)] focus:ring-4 focus:ring-[#007d82]/10" />

          <button type="button" (click)="togglePassword()" class="absolute right-4 top-[47px] text-[var(--color-texto-suave)] transition hover:text-[var(--color-principal)]" [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" class="h-6 w-6"><path d="M12 4.5c-4.74 0-8.777 2.943-10.5 7.5 1.723 4.557 5.76 7.5 10.5 7.5s8.777-2.943 10.5-7.5c-1.723-4.557-5.76-7.5-10.5-7.5Zm0 12a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9Z"/><path d="M12 9.75a2.25 2.25 0 1 0 0 4.5 2.25 2.25 0 0 0 0-4.5Z" /></svg>
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.269-2.943-9.543-7a10.05 10.05 0 012.455-3.837m1.888-1.414 A9.964 9.964 0 0112 5c4.477 0 8.268 2.943 9.542 7a9.978 9.978 0 01-4.305 5.274M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18"/></svg>
          </button>
        </div>

        <div *ngIf="errorMessage" class="rounded-xl border border-red-200 bg-red-50 px-4 py-4 text-center text-sm font-medium text-red-600">
          {{ errorMessage }}
        </div>

        <button type="submit" [disabled]="!email || !password"
          class="w-full rounded-xl bg-[var(--color-acento)] px-5 py-4 text-lg font-bold text-white shadow-lg transition hover:-translate-y-0.5 hover:bg-[#e95f50] hover:shadow-xl disabled:cursor-not-allowed disabled:opacity-50">
          Entrar
        </button>
      </form>
    </section>
  </main>

  <footer class="border-t border-[var(--color-borde)] bg-white/70 px-4 py-5">
    <div class="mx-auto flex max-w-7xl items-center justify-between text-sm font-bold text-[var(--color-principal)]">
      <span>DonTacaño.com</span>
      <span>✉ Contacto</span>
    </div>
  </footer>
</div>
